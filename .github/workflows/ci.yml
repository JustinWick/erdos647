name: Finite core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finite-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          use-mathlib-cache: true
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-core-results
          path: results/
          if-no-files-found: ignore
          retention-days: 14
